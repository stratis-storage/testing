---
name: testing CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'CHANGES.txt'
      - 'README.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'CHANGES.txt'
      - 'README.md'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  python-checks:
    strategy:
      matrix:
        include:
          # MANDATORY CHECKS USING CURRENT DEVELOPMENT INTERPRETER
          - dependencies: >
              python3-dbus
              python3-dbus-python-client-gen
              python3-justbytes
              python3-gobject
              python3-psutil
              ruff
            image: fedora:44  # CURRENT DEVELOPMENT ENVIRONMENT
            task: make -f Makefile lint
          - dependencies: ruff
            image: fedora:44  # CURRENT DEVELOPMENT ENVIRONMENT
            task: make -f Makefile fmt-travis
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install dependencies
        run: >
          dnf install -y
          git
          make
          python-unversioned-command
          ${{ matrix.dependencies }}
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Display Python version
        run: python --version
      - name: Run test
        run: ${{ matrix.task }}

  general_checks:
    uses: stratis-storage/github-actions/.github/workflows/reusable_general.yml@master
    with:
      fedora-container-image-number: 44  # CURRENT DEVELOPMENT ENVIRONMENT
